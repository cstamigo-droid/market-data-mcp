[project]
name = "market-data-mcp"
version = "0.1.1"
description = "Real-time market data: quotes, news, earnings calendar and a watchlist scanner for AI agents, backed by Finnhub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cristian Amigo", email = "cstamigo@gmail.com" }]
dependencies = [
    "mcp>=1.2.0,<2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/cstamigo-droid/market-data-mcp"
Repository = "https://github.com/cstamigo-droid/market-data-mcp"
"Bug Tracker" = "https://github.com/cstamigo-droid/market-data-mcp/issues"

[project.scripts]
market-data-mcp = "market_data_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["market_data_mcp*"]
